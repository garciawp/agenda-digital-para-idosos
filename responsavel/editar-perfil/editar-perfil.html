<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf7f2">
    <meta name="description" content="Agenda Digital para Idosos | Medicamentos, compromissos e eventos.">
    <title>Editar meus dados | Agenda Digital para Idosos</title>
    <link rel="icon" type="image/png" href="../../recursos/imagens/logo.png">
    <link rel="stylesheet" href="../../recursos/estilos/geral.css">
    <link rel="stylesheet" href="editar-perfil.css">
    <script src="../../recursos/bibliotecas/supabase-2.119.1.js" defer=""></script>
    <script src="../../recursos/scripts/configuracao.js" defer=""></script>
    <script src="../../recursos/scripts/banco.js" defer=""></script>
    <script src="../../recursos/scripts/dados.js" defer=""></script>
    <script src="../../recursos/scripts/geral.js" defer=""></script>
    <script src="editar-perfil.js" defer=""></script>
  </head>
  <body>
    <a class="pular-conteudo" href="#conteudo">Ir para o conteúdo</a>
    <header id="cabecalho" class="cabecalho">
      <a class="marca" href="../pessoas/pessoas.html"><img src="../../recursos/imagens/logo.png" alt=""><span>Agenda Digital<br>para Idosos</span></a>
      <div class="acoes-cabecalho">
        <span class="usuario-cabecalho"></span>
        <button type="button" class="botao ligacao" data-acao="sair"><span class="icone" aria-hidden="true">logout</span><span class="texto-botao"> Sair</span></button>
      </div>
    </header>
    <section id="estado-conexao" class="painel pagina-acesso" role="status">
      <p data-mensagem="">Conectando sua agenda...</p>
      <button type="button" class="botao contorno" data-tentar-novamente="" hidden="">Tentar novamente</button>
      <a class="botao suave" href="../../paginas/entrar/entrar.html">Ir para o acesso</a>
    </section>
    <main id="conteudo" tabindex="-1" data-pagina="editar-perfil" data-perfil="RESPONSAVEL" hidden="">
      <div class="titulo-pagina">
        <div>
          <h1>Editar meus dados</h1>
        </div>
      </div>
      <section class="painel">
        <form class="formulario" data-formulario="perfil" aria-describedby="erro-formulario" method="post">
          <div class="erro-formulario" role="alert" tabindex="-1" hidden="" id="erro-formulario">
          </div>
          <div class="grade-formulario">
            <div class="campo">
              <label for="nome_completo">Nome completo</label>
              <input id="nome_completo" name="nome_completo" type="text" required="" maxlength="120" autocomplete="name" minlength="2">
            </div>
            <div class="campo">
              <label for="nome_exibicao">Como prefere ser chamado(a)?</label>
              <input id="nome_exibicao" name="nome_exibicao" type="text" maxlength="120">
            </div>
            <div class="campo">
              <label for="data_nascimento">Data de nascimento (opcional)</label>
              <input id="data_nascimento" name="data_nascimento" type="date" max="2026-11-19">
            </div>
            <div class="campo">
              <label for="telefone">Telefone (opcional)</label>
              <input id="telefone" name="telefone" type="tel" maxlength="30" autocomplete="tel">
            </div>
          </div>
          <div class="linha">
            <button class="botao principal" type="submit"><span class="texto-botao">Salvar dados</span></button>
            <a class="botao contorno" href="../perfil/perfil.html">Cancelar</a>
          </div>
        </form>
      </section>
    </main>
    <nav class="navegacao-inferior" aria-label="Navegação principal" data-perfil="RESPONSAVEL">
      <a class="item-navegacao" href="../pessoas/pessoas.html"><span class="icone" aria-hidden="true">group</span><span>Pessoas</span></a>
      <a class="item-navegacao" href="../inicio/inicio.html"><span class="icone" aria-hidden="true">home</span><span>Início</span></a>
      <a class="item-navegacao" href="../agenda/agenda.html"><span class="icone" aria-hidden="true">event_note</span><span>Agenda</span></a>
      <a class="item-navegacao" href="../perfil/perfil.html" aria-current="page"><span class="icone" aria-hidden="true">account_circle</span><span>Perfil</span></a>
    </nav>
    <div id="aviso" class="aviso-flutuante" role="status" aria-live="polite" hidden="">
    </div>
    <dialog id="dialogo" aria-labelledby="titulo-dialogo">
      <h2 id="titulo-dialogo">Confirmar ação</h2>
      <p id="descricao-dialogo"></p>
      <form method="dialog" class="acoes-dialogo">
        <button class="botao contorno" value="cancel" autofocus=""><span class="texto-botao">Voltar</span></button>
        <button class="botao principal" value="ok" id="confirmar-dialogo"><span class="texto-botao">Confirmar</span></button>
      </form>
    </dialog>
  </body>
</html>
